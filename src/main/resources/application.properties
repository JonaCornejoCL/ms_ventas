# 1. Identificación del Microservicio Orquestador, en este caso ms_ventas
spring.application.name=ms_ventas
server.port=8080

# 2. Configuración de Logs y Consola (Trazabilidad)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS

# 3. Conexión a Base de Datos Supabase (PostgreSQL - Shared Pooler IPv4)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.pjryhukplrppfspdiftt
spring.datasource.password=TiendaBlinblineo12345*
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Configuración de JPA e Hibernate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=bd_ventas

# 5. Migraciones Automáticas con Flyway
spring.flyway.enabled=true
spring.flyway.default-schema=bd_ventas
spring.flyway.schemas=bd_ventas
spring.flyway.locations=classpath:db/migration